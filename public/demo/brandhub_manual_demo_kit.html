<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hồ Sơ Dữ Liệu Thực Nghiệm &amp; Kịch Bản Báo Cáo — ĐH FPT 2027 (SE08)</title>
  <style>
    :root {
      --bg-body: #fafafa;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-orange-soft: #fffaf5;
      --bg-orange-badge: #ffedd5;
      --bg-amber-soft: #fffbeb;
      --bg-emerald-soft: #ecfdf5;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #475569;
      --text-orange: #9a3412;
      --text-amber: #78350f;
      --text-emerald: #065f46;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --border-orange: #fed7aa;
      --border-amber: #fcd34d;
      --border-emerald: #34d399;
      --accent: #ea6c3b;
      --accent-hover: #d95d2c;
      --focus-bg: #ffffff;
    }
    html.dark {
      --bg-body: #09090b;
      --bg-card: #121215;
      --bg-subtle: #18181b;
      --bg-orange-soft: rgba(234, 108, 59, 0.14);
      --bg-orange-badge: rgba(234, 108, 59, 0.22);
      --bg-amber-soft: rgba(245, 158, 11, 0.16);
      --bg-emerald-soft: rgba(16, 185, 129, 0.16);
      --text-main: #f8fafc;
      --text-body: #e2e8f0;
      --text-muted: #94a3b8;
      --text-orange: #fed7aa;
      --text-amber: #fde68a;
      --text-emerald: #a7f3d0;
      --border: #27272a;
      --border-strong: #3f3f46;
      --border-orange: rgba(234, 108, 59, 0.45);
      --border-amber: rgba(245, 158, 11, 0.45);
      --border-emerald: rgba(16, 185, 129, 0.45);
      --focus-bg: #09090b;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0 !important;
    }
    body {
      margin: 0;
      font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      font-size: 13px;
    }
    .mono {
      font-family: 'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    button, a, input, textarea {
      font: inherit;
      color: inherit;
    }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: none !important;
      box-shadow: 0 0 0 2px var(--focus-bg), 0 0 0 4px var(--accent) !important;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
    .btn {
      min-height: 30px;
      padding: 5px 11px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--border-orange); background: var(--bg-orange-soft); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #ffffff; }
    .btn-done {
      background: var(--bg-emerald-soft);
      border-color: var(--border-emerald);
      color: var(--text-emerald);
      font-weight: 700;
    }
    .btn-tab-active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-body);
    }
    .badge-orange {
      background: var(--bg-orange-soft);
      border-color: var(--border-orange);
      color: var(--text-orange);
    }
    .badge-amber {
      background: var(--bg-amber-soft);
      border-color: var(--border-amber);
      color: var(--text-amber);
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .header-top {
      max-width: 1600px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .roles-strip {
      border-top: 1px solid var(--border);
      background: var(--bg-subtle);
    }
    .roles-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 6px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .layout-step {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      align-items: start;
      max-width: 1600px;
      margin: 0 auto;
    }
    @media (max-width: 980px) {
      .layout-step { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
    .sidebar {
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 86px);
      overflow-y: auto;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
    }
    .step-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }
    .step-btn:hover { background: var(--bg-subtle); }
    .step-btn.active { background: var(--bg-orange-soft); }
    .main-pane {
      padding: 16px;
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .wide-pane {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 16px;
    }
    .field-card {
      border: 1px solid var(--border);
      background: var(--bg-card);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field-card.copied {
      background: var(--bg-emerald-soft);
      border-color: var(--border-emerald);
    }
    .field-box {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-main);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      resize: vertical;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
    }
    @media (max-width: 1200px) {
      .grid-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .grid-2, .grid-3, .grid-6 { grid-template-columns: 1fr; }
    }
    .alert-amber {
      padding: 11px 14px;
      border: 1px solid var(--border-amber);
      background: var(--bg-amber-soft);
      color: var(--text-amber);
      font-size: 12.5px;
    }
    .check-row {
      width: 100%;
      min-height: 36px;
      padding: 9px 12px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      text-align: left;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }
    .check-row:last-child { border-bottom: 0; }
    .check-row.done { background: var(--bg-subtle); color: var(--text-muted); text-decoration: line-through; }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 60;
      padding: 10px 14px;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent-hover);
      font-weight: 700;
      font-size: 12.5px;
      max-width: 420px;
      display: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="brand">

        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">

        <input

          title="Mặc định: https://brandhub.id.vn (dự phòng: http://localhost:3000)"
        />

        <button type="button" class="btn" onclick="toggleTheme()" id="theme-btn">Nền Tối</button>
      </div>
    </div>

    <div class="roles-strip">
      <div class="roles-inner">
        <div id="roles-bar" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"></div>
        <div class="mono" style="font-size:11px;color:var(--text-muted);">
          Phím nhanh: <strong>[C]</strong> chép ô tiếp · <strong>[1–5]</strong> chép ô 1–5 · <strong>[←/→]</strong> đổi bước
        </div>
      </div>
    </div>
  </header>

      pkg_desc: 'Chiến dịch 4 tuần tuyển sinh chương trình Thạc sĩ FPT 2027: bài đăng mạng xã hội, Reels, Workshop online, PR báo điện tử và bản tin Email.',

    function regCopy(key, text, label) {
      COPY_REG[key] = { text: String(text == null ? '' : text), label: String(label || '') };
      return key;
    }

    function fallbackExecCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', 'true');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    function safeCopyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackExecCopy(text));
        return;
      }
      fallbackExecCopy(text);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function resolvePath(tpl) {
      return tpl
        .replace('{agency_id}', IDS.agency_id)
        .replace('{workspace_id}', IDS.workspace_id)
        .replace('{campaign_id}', IDS.campaign_id)
        .replace('{task_id}', IDS.task_id)
        .replace('{post_id}', IDS.post_id);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.display = 'block';
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(() => { el.style.display = 'none'; }, 3200);
    }

    function copyVal(text, key, label) {
      if (!clockTimer && clockSec === 0) toggleClock();
      safeCopyText(text);
      copiedMap[key] = true;
      showToast(label ? `Đã sao chép "${label}" — nhấn Ctrl+V để dán.` : 'Đã sao chép vào Clipboard.');
      render();
    }

    function copyReg(key) {
      const item = COPY_REG[key];
      if (!item) return;
      copyVal(item.text, key, item.label);
    }

    function copyById(key, textId, label) {
      const el = document.getElementById(textId);
      const val = el ? (el.value !== undefined ? el.value : el.innerText) : '';
      copyVal(val, key, label);
    }

      const pick = idx >= 0 ? idx : 0;
      const f = s.fields[pick];
      const val = f.key ? TEXTS[f.key] : f.value;
      copyVal(val, `${s.code}_${pick}`, f.label);
    }

    function toggleClock() {
      if (clockTimer) {
        clearInterval(clockTimer);
        clockTimer = null;
      } else {
        clockTimer = setInterval(() => {
          clockSec += 1;
          updateClockUI();
        }, 1000);
      }
      updateClockUI();
    }

    function resetClock() {
      if (clockTimer) { clearInterval(clockTimer); clockTimer = null; }
      clockSec = 0;
      updateClockUI();
    }

    function updateClockUI() {
      const m = String(Math.floor(clockSec / 60)).padStart(2, '0');

      document.getElementById('clock-text').textContent = `${m}:${s}`;

        const areaId = `area_${k}`;
        return `
          <div class="field-card ${copiedMap[k] ? 'copied' : ''}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="badge badge-orange mono">${i + 1}</span>
                <strong>${esc(f.label)}</strong>
                <span class="badge">${esc(f.type)}</span>
                ${i < 5 ? `<span class="badge mono">Phím ${i + 1}</span>` : ''}
              </div>
              <button type="button" class="btn ${copiedMap[k] ? 'btn-done' : 'btn-primary'}" onclick="copyById('${k}', '${areaId}', '${esc(f.label)}')">
                ${copiedMap[k] ? '✓ Đã sao chép · Chép lại' : 'Sao chép ngay'}
              </button>
            </div>
            ${f.key
              ? `<textarea id="${areaId}" rows="${Math.min(5, Math.max(2, Math.ceil(val.length / 105)))}" class="field-box mono" oninput="TEXTS['${f.key}']=this.value">${esc(val)}</textarea>`
              : `<div id="${areaId}" class="field-box mono" onclick="copyById('${k}', '${areaId}', '${esc(f.label)}')" style="cursor:pointer;">${esc(val)}</div>`
            }
            ${f.note ? `<div style="font-size:11.5px;color:var(--text-muted);">${esc(f.note)}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <div class="layout-step">
          <aside class="sidebar">${sidebarHtml}</aside>
          <main class="main-pane">
            <div class="card" style="display:flex;flex-direction:column;gap:14px;">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
                <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:240px;">
                  <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <span class="badge mono">${s.num === 0 ? `Chuẩn bị · ${s.code}` : `Bước ${s.num}/12 · ${s.code}`}</span>
                    <span class="badge badge-orange">${s.role}: ${esc(s.actor)}</span>
                    <span class="badge mono">${s.time}</span>
                    <span class="badge mono">${s.fr}</span>
                  </div>
                  <h1 style="margin:0;font-size:18px;line-height:1.35;">${esc(s.title)}</h1>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    <a href="${esc(fullRoute)}" target="_blank" rel="noreferrer" class="btn mono" style="font-size:11.5px;">${esc(resolvePath(s.route))} ↗</a>
                    <button type="button" class="btn" onclick="copyVal('${esc(fullRoute)}', 'url_${s.code}', 'URL ${s.code}')">Copy URL</button>
                    ${(s.extraRoutes || []).map((er, ei) => {
                      const erFull = `${appUrl}${resolvePath(er.route)}`;
                      return `<a href="${esc(erFull)}" target="_blank" rel="noreferrer" class="btn" style="background:var(--bg-orange-soft);border-color:var(--border-orange);color:var(--text-orange);">${esc(er.label)} ↗</a>`;
                    }).join('')}
                  </div>
                </div>
                <div style="display:flex;gap:6px;">
                  <button type="button" class="btn" ${stepIdx === 0 ? 'disabled' : ''} onclick="selectStep(${stepIdx - 1})">← Trước</button>
                  <button type="button" class="btn btn-primary" onclick="copyNextInStep()">Chép ô tiếp [C]</button>
                  <button type="button" class="btn" ${stepIdx === STEPS.length - 1 ? 'disabled' : ''} onclick="selectStep(${stepIdx + 1})">Tiếp →</button>
                </div>
              </div>

              ${s.trap ? `<div class="alert-amber"><strong>Lưu ý quan trọng:</strong> ${esc(s.trap)}</div>` : ''}

              <div style="display:flex;flex-direction:column;gap:8px;">
                <strong style="font-size:12px;text-transform:uppercase;color:var(--text-muted);">Dữ liệu mẫu bước ${s.code} (Bấm 1 chạm để sao chép)</strong>
                ${fieldsHtml}
              </div>

              <div>
                <strong style="display:block;font-size:12px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Trình tự thao tác tay trên trình duyệt (Nhấp để đánh dấu xong)</strong>
                <div style="border:1px solid var(--border);">
                  ${s.checklist.map((line, ci) => {
                    const ck = `${s.code}_c_${ci}`;
                    return `<button type="button" class="check-row ${checkMap[ck] ? 'done' : ''}" onclick="toggleCheck('${ck}')">
                      <span class="badge ${checkMap[ck] ? '' : 'badge-orange'} mono">${checkMap[ck] ? '✓' : ci + 1}</span>
                      <span>${esc(line)}</span>
                    </button>`;
                  }).join('')}
                </div>
              </div>

              <div style="padding:11px 13px;border:1px solid var(--border);background:var(--bg-subtle);">
                <strong style="font-size:11px;text-transform:uppercase;color:var(--text-muted);">Lời dẫn gợi ý trước Hội đồng:</strong>
                <div style="margin-top:4px;color:var(--text-body);">${esc(s.script)}</div>
              </div>
            </div>

            ${renderQaCards()}
          </main>
        </div>
      `;
    }

    function renderSheetView() {
      const sheetItems = [
        { step: 'B1', role: 'Owner', label: 'Tên gói mới (Thạc sĩ FPT 2027)', key: 'pkg_name', note: 'Ngân sách: 85000000 · Thời lượng: 4 tuần · 5 hạng mục (12, 2, 2, 4, 2)' },
        { step: 'B1', role: 'Owner', label: 'Ngân sách dự kiến (85 triệu VNĐ)', key: 'pkg_budget', note: 'Nhập số liền không dấu chấm' },
        { step: 'B1', role: 'Owner', label: 'Mô tả gói truyền thông', key: 'pkg_desc', note: 'Ô RichText Mô tả gói' },
        { step: 'B4', role: 'Creator', label: 'Chủ đề gọi Gemini AI Tạo Caption', key: 'ai_topic', note: 'Chọn: Thông báo · Chuyên nghiệp · Facebook · Vừa' },
        { step: 'B5', role: 'Creator', label: 'Câu kiểm thử vi phạm an toàn (FR 3.6.33)', key: 'violation_sample', note: 'Dán vào ô Nội dung -> chờ 3 giây hiện cảnh báo' },
        { step: 'B5', role: 'Creator', label: 'Bản thảo sạch v1 (Thay câu vi phạm)', key: 'caption_v1_clean', note: 'Ctrl+A -> Ctrl+V đè toàn bộ ô Nội dung' },
        { step: 'B5', role: 'Creator', label: 'Bộ 6 Hashtags bài viết', key: 'hashtags_line', note: 'Dán vào ô Bộ Hashtags + nhấn Enter -> Nộp phần' },
        { step: 'B7', role: 'Client', label: 'Góp ý trả lại của Ban Tuyển sinh ĐH FPT', key: 'client_reject_note', note: 'Client bấm Trả lại ở POST.CAPTION -> Dán góp ý' },
        { step: 'B8', role: 'Creator', label: 'Đoạn bổ sung Học bổng 50%-100% & OJT (v2)', key: 'caption_v2_addition', note: 'Đặt con trỏ cuối bài v1 -> Ctrl+V -> Nộp phần -> Xem Diff' },
        { step: 'B8', role: 'Creator', label: '(Dự phòng) Trọn bộ bài viết hoàn chỉnh v2', key: 'caption_v2_full', note: 'Dùng nếu lỡ xóa mất nội dung v1' }
      ];

      return `
        <main class="wide-pane">
          <div class="card">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
              <strong>6 Tài khoản Canonical Roles (Mật khẩu chung: <span class="mono">${PASSWORD}</span>)</strong>
              <button type="button" class="btn btn-primary mono" onclick="copyVal('${PASSWORD}', 'sheet_pwd', 'Mật khẩu Password123')">Copy mật khẩu: ${PASSWORD}</button>
            </div>
            <div class="grid-6">
              ${ROLES.map((r) => {
                const u = `${appUrl}${resolvePath(r.route)}`;
                return `
                  <div class="field-card" style="justify-content:space-between;">
                    <div>
                      <div style="display:flex;justify-content:space-between;gap:4px;">
                        <span class="badge badge-orange mono">${r.role}</span>
                        <span style="font-size:11px;color:var(--text-muted);">${esc(r.short)}</span>
                      </div>
                      <strong style="display:block;margin-top:6px;font-size:12px;">${esc(r.name)}</strong>
                      <div class="mono" style="font-size:11px;color:var(--text-muted);word-break:break-all;">${esc(r.email)}</div>
                    </div>
                    <div style="display:flex;gap:4px;">
                      ${r.role !== 'Guest' ? `<button type="button" class="btn" style="flex:1;justify-content:center;" onclick="copyVal('${esc(r.email)}', 'sh_em_${r.role}', 'Email ${r.role}')">Email</button>` : ''}
                      <a href="${esc(u)}" target="_blank" rel="noreferrer" class="btn" style="flex:1;justify-content:center;">Mở ↗</a>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="card">
            <strong style="display:block;margin-bottom:10px;">Bảng Phẳng Toàn Bộ 10 Ô Dữ Liệu Cần Dán Trong 20 Phút Demo (B1 → B12)</strong>
            <div class="grid-2">
              ${sheetItems.map((it, idx) => {
                const k = `sh_${it.key}`;
                const val = TEXTS[it.key];
                return `
                  <div class="field-card ${copiedMap[k] ? 'copied' : ''}">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;">
                      <div style="display:flex;align-items:center;gap:6px;">
                        <span class="badge mono">${idx + 1}. ${it.step}</span>
                        <span class="badge badge-orange mono">${it.role}</span>
                        <strong>${esc(it.label)}</strong>
                      </div>
                      <button type="button" class="btn ${copiedMap[k] ? 'btn-done' : 'btn-primary'}" onclick="copyVal(TEXTS['${it.key}'], '${k}', '${esc(it.label)}')">
                        ${copiedMap[k] ? '✓ Đã chép' : 'Sao chép'}
                      </button>
                    </div>
                    <div class="field-box mono" style="max-height:110px;overflow-y:auto;cursor:pointer;" onclick="copyVal(TEXTS['${it.key}'], '${k}', '${esc(it.label)}')">${esc(val)}</div>
                    <div style="font-size:11px;color:var(--text-muted);">${esc(it.note)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="alert-amber">
            <strong>Ba điểm chốt trên sân khấu (Lộc bấm máy · Trung thuyết trình):</strong>
            (1) <strong>Tại B9</strong>: Sau khi Client bấm Duyệt v2, chuyển sang cửa sổ Creator trên <span class="mono">/editor</span> bấm nút cam <strong>"Gửi phê duyệt"</strong> để chốt <span class="mono">Task FINISHED</span> &amp; <span class="mono">Post APPROVED</span>.
            (2) <strong>Tại B10</strong>: Bấm Đăng ngay trên đúng <strong>1 kênh thật đã nối OAuth</strong> (Facebook Fanpage / Threads) rồi mở tab thật đối chiếu.
            (3) <strong>Tại B11</strong>: Giới thiệu gói <span class="mono">Plus = 1.490.000đ/tháng</span> rồi qua <span class="mono">/credit</span> nạp lẻ tùy chỉnh <strong>10 Credits = 2.000đ</strong> để quét VietQR ngân hàng thật.
          </div>

          ${renderQaCards()}
        </main>
      `;
    }

    function renderCreateView() {
      return `
        <main class="wide-pane">
          <div class="grid-2">
            ${CREATE_PACKS.map((p) => {
              const u = `${appUrl}${resolvePath(p.route)}`;
              return `
                <div class="card" style="display:flex;flex-direction:column;gap:10px;">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
                    <div>
                      <span class="badge badge-orange mono">${esc(p.role)}</span>
                      <h2 style="margin:6px 0 0;font-size:15px;">${esc(p.title)}</h2>
                    </div>
                    <a href="${esc(u)}" target="_blank" rel="noreferrer" class="btn">Mở màn hình ↗</a>
                  </div>
                  <div style="padding:8px 10px;background:var(--bg-subtle);border:1px solid var(--border);font-size:12px;">
                    ${p.steps.map((st, si) => `<div><strong class="mono" style="color:var(--accent);">${si + 1}.</strong> ${esc(st)}</div>`).join('')}
                  </div>
                  ${p.fields.map((f) => {
                    const k = regCopy(`cr_${f.id}`, f.value, f.label);
                    return `
                      <div class="field-card ${copiedMap[k] ? 'copied' : ''}">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                          <strong style="font-size:12px;">${esc(f.label)}</strong>
                          <button type="button" class="btn ${copiedMap[k] ? 'btn-done' : 'btn-primary'}" onclick="copyReg('${k}')">
                            ${copiedMap[k] ? '✓ Đã chép' : 'Sao chép'}
                          </button>
                        </div>
                        <div class="field-box mono" style="cursor:pointer;" onclick="copyReg('${k}')">${esc(f.value)}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `;
            }).join('')}
          </div>
        </main>
      `;
    }

    function render() {
      syncEnvButtons();
      renderRolesStrip();
      const root = document.getElementById('app-root');
      if (view === 'sheet') root.innerHTML = renderSheetView();
      else if (view === 'create') root.innerHTML = renderCreateView();
      else root.innerHTML = renderStepView();
    }

    window.addEventListener('keydown', (e) => {
      const t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA') return;
      if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        copyNextInStep();
      } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        if (view === 'step') { e.preventDefault(); selectStep(stepIdx + 1); }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (view === 'step') { e.preventDefault(); selectStep(stepIdx - 1); }
      } else if (['1', '2', '3', '4', '5'].includes(e.key) && view === 'step') {
        const idx = Number(e.key) - 1;
        const s = STEPS[stepIdx];
        const f = s.fields[idx];
        if (f) {
          e.preventDefault();
          copyVal(f.key ? TEXTS[f.key] : f.value, `${s.code}_${idx}`, f.label);
        }
      }
    });

    render();
  </script>
</body>
</html>
